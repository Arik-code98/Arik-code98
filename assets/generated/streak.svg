<svg xmlns="http://www.w3.org/2000/svg" width="860" height="190" viewBox="0 0 860 190" role="img" aria-labelledby="title desc">
  <title id="title">GitHub streak card for Arik Chakraborty</title>
  <desc id="desc">A self-hosted card showing the current streak, longest streak, and active weeks.</desc>
  <rect width="860" height="190" rx="22" fill="#130f0c" />
  <rect x="1" y="1" width="858" height="188" rx="21" fill="none" stroke="#2d221c" />
  
  <text x="36" y="38" fill="#b39b84" font-size="12" letter-spacing="1.1">STREAK / CONSISTENCY</text>
  <rect x="36" y="56" width="250" height="116" rx="16" fill="#1b1511" stroke="#2d221c" />
  <text x="58" y="86" fill="#b39b84" font-size="13">current streak</text>
  <text x="58" y="132" fill="#f4e6d6" font-size="48" font-weight="700">0</text>
  <text x="58" y="156" fill="#b39b84" font-size="13">last active Jul 30, 2026</text>

  <rect x="304" y="56" width="250" height="116" rx="16" fill="#1b1511" stroke="#2d221c" />
  <text x="326" y="86" fill="#b39b84" font-size="13">longest streak</text>
  <text x="326" y="132" fill="#f4e6d6" font-size="48" font-weight="700">31</text>
  <text x="326" y="156" fill="#b39b84" font-size="13">Mar 12, 2026 -&gt; Apr 11, 2026</text>

  <rect x="572" y="56" width="252" height="116" rx="16" fill="#1b1511" stroke="#2d221c" />
  <text x="594" y="86" fill="#b39b84" font-size="13">active weeks this year</text>
  <text x="594" y="132" fill="#f4e6d6" font-size="48" font-weight="700">12</text>
  <text x="594" y="156" fill="#b39b84" font-size="13">weeks with at least one public contribution</text>

</svg>
